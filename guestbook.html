<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1028">
<meta name="description" content="cgos.cc 留言板：留下你的想法，顶部滚动展示最新留言。">
<title>留言板 · cgos.cc</title>
<link rel="stylesheet" href="assets/main.css">
<link rel="stylesheet" href="assets/chat-widget.css">
<style>
  /* 顶部滚动留言条 */
  .ticker-wrap{
    position:fixed; top:64px; left:0; right:0; z-index:40;
    background:rgba(226,96,63,.12); border-bottom:1px solid rgba(226,96,63,.2);
    overflow:hidden; padding:10px 0;
  }
  .ticker-track{
    display:flex; white-space:nowrap; animation:ticker 24s linear infinite;
  }
  .ticker-item{
    display:inline-flex; align-items:center; gap:10px;
    padding:0 40px; font-size:14px; color:rgba(240,230,210,.85);
  }
  .ticker-item .email{ color:var(--accent); font-weight:500; }
  .ticker-item .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); }
  .ticker-empty{ width:100%; text-align:center; color:rgba(240,230,210,.5); font-size:13px; }
  @keyframes ticker{ 0%{ transform:translateX(0); } 100%{ transform:translateX(-50%); } }

  /* 主内容区给滚动条留出空间 */
  .gb-main{ padding-top:140px; }
  @media (max-width:800px){ .gb-main{ padding-top:120px; } }
</style>
</head>
<body>

<header>
  <div class="container">
    <nav>
      <div class="logo"><a href="./">zhuzhiliao</a></div>
      <div class="nav-links" id="nav-links">
        <a href="./">首页</a>
        <a href="guestbook.html" class="active">留言</a>
      </div>
      <button class="menu-btn" id="menu-btn" aria-label="menu">☰</button>
    </nav>
  </div>
</header>

<div class="ticker-wrap">
  <div class="container" style="overflow:hidden;">
    <div id="ticker" class="ticker-track"><span class="ticker-empty">加载最新留言…</span></div>
  </div>
</div>

<section class="gb-main">
  <div class="container">
    <h2 class="section-title">留言板</h2>
    <p class="section-sub">输入邮箱即可留言，最新留言会在顶部滚动展示。</p>
    <div class="two-col">
      <div>
        <form id="guestbook-form">
          <div class="form-group">
            <label for="gb-email">邮箱</label>
            <input type="email" id="gb-email" required placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label for="gb-message">留言</label>
            <textarea id="gb-message" required maxlength="500" placeholder="写点什么..."></textarea>
          </div>
          <button type="submit" class="btn">提交留言</button>
          <div class="msg" id="gb-msg"></div>
        </form>
      </div>
      <div>
        <h2 class="section-title" style="font-size:22px;">全部留言</h2>
        <div class="list" id="guestbook-list"><div class="list-empty">加载中…</div></div>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-content">
      <div class="footer-section">
        <h3>关于我们</h3>
        <p>cgos.cc - 传统玩具「竹知了」的 Web 模拟版系列项目</p>
        <p>用现代技术重现童年记忆</p>
      </div>
      <div class="footer-section">
        <h3>快速链接</h3>
        <ul>
          <li><a href="index.html">首页</a></li>
          <li><a href="index.html#projects">项目展示</a></li>
          <li><a href="index.html#stats">站点统计</a></li>
          <li><a href="index.html#chat">聊天室</a></li>
        </ul>
      </div>
      <div class="footer-section">
        <h3>项目版本</h3>
        <ul>
          <li><a href="zhuzhiliao/">经典版</a></li>
          <li><a href="zhuzhiliao-meme/">声音Meme版</a></li>
          <li><a href="zhuzhiliao-ai/">AI公司版</a></li>
        </ul>
      </div>
      <div class="footer-section">
        <h3>友情链接</h3>
        <ul>
          <li><a href="https://github.com/wuxiumu/ZhuZhilLao-AI" target="_blank">GitHub 仓库</a></li>
          <li><a href="https://cgos.cc" target="_blank">cgos.cc</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom" id="footer-bottom">
      <!-- 动态内容由 JavaScript 生成 -->
    </div>
  </div>
</footer>

<script src="assets/config.js"></script>
<script>
// 动态生成底部版权信息
(function() {
  const config = window.CGOS_CONFIG || {};
  const footer = config.FOOTER || {};
  const footerBottom = document.getElementById('footer-bottom');

  if (footerBottom) {
    let linksHtml = '';
    if (footer.links && footer.links.length > 0) {
      linksHtml = footer.links.map(link =>
        `<a href="${link.url}" target="${link.target || '_blank'}">${link.text}</a>`
      ).join(' | ');
    }

    footerBottom.innerHTML = `
      <p>${footer.copyright || '© 2024 cgos.cc. All rights reserved.'}</p>
      <p>${footer.poweredBy || 'Powered by PHP + Redis'}${footer.statsUrl ? ` | <a href="${footer.statsUrl}" target="_blank">站点统计</a>` : ''}${linksHtml ? ` | ${linksHtml}` : ''}</p>
    `;
  }
})();
</script>
<script src="assets/main.js"></script>
<script src="assets/chat-widget.js"></script>

</body>
</html>
