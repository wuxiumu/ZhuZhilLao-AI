<style>
  :root{
    --ink:#0a1028;
    --paper:#f0e6d2;
    --accent:#e2603f;
    --accent-dim:#b34a30;
    --bamboo:#a8b06a;
    --serif:"Songti SC","Noto Serif SC","Noto Serif CJK SC","STSong","SimSun",serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%; overflow:hidden; background:var(--ink);
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  canvas#cv{
    position:fixed; inset:0; display:block;
    touch-action:none; cursor:grab;
  }
  canvas#cv.holding{ cursor:grabbing; }

  /* —— 竖排标题 —— */
  .masthead{
    position:fixed;
    top:calc(26px + env(safe-area-inset-top));
    left:calc(20px + env(safe-area-inset-left));
    display:flex; gap:14px; pointer-events:none;
    color:var(--paper); font-family:var(--serif);
  }
  .masthead h1{
    writing-mode:vertical-rl;
    font-size:clamp(42px, 7.5vh, 66px);
    font-weight:700; letter-spacing:.32em;
    text-shadow:0 0 24px rgba(255,170,100,.25);
  }
  .masthead .sub{
    writing-mode:vertical-rl;
    font-size:clamp(12px, 1.8vh, 15px);
    letter-spacing:.5em; opacity:.62; padding-top:10px;
  }
  .masthead .seal{
    writing-mode:vertical-rl;
    align-self:flex-start;
    font-size:11px; letter-spacing:.28em;
    color:var(--ink); background:var(--accent);
    padding:8px 3px; border-radius:3px; opacity:.92;
  }

  /* —— 声音主题切换 —— */
  .theme-picker{
    position:fixed;
    top:calc(24px + env(safe-area-inset-top));
    left:50%; transform:translateX(-50%);
    z-index:4; display:flex; align-items:center; gap:12px;
    max-width:min(66vw, 760px);
    color:var(--paper); font-family:var(--serif);
  }
  .theme-kicker{
    flex:none; font-size:10px; letter-spacing:.28em; opacity:.48;
    writing-mode:vertical-rl;
  }
  .theme-tabs{
    display:flex; align-items:center; gap:7px;
    overflow-x:auto; scrollbar-width:none; padding:3px;
  }
  .theme-tabs::-webkit-scrollbar{ display:none; }
  .theme-tab{
    flex:none; display:inline-flex; align-items:center; gap:7px;
    padding:8px 12px 8px 10px;
    color:var(--paper); background:rgba(12,17,39,.46);
    border:1px solid rgba(240,230,210,.2); border-radius:4px;
    font:inherit; font-size:12px; letter-spacing:.16em;
    cursor:pointer; opacity:.62; transition:all .25s ease;
    touch-action:manipulation;
  }
  .theme-tab .swatch{
    width:8px; height:8px; border-radius:50%; background:var(--tab-accent);
    box-shadow:0 0 10px var(--tab-accent); flex:none;
  }
  .theme-tab:hover,.theme-tab:focus-visible{ opacity:1; border-color:var(--tab-accent); outline:none; }
  .theme-tab.active{
    opacity:1; color:#101323; background:var(--tab-accent);
    border-color:var(--tab-accent); box-shadow:0 0 20px color-mix(in srgb, var(--tab-accent) 34%, transparent);
  }
  .theme-tab.active .swatch{ background:currentColor; box-shadow:none; }
  .theme-tab.switching{ animation:themeFlash .42s ease both; }
  @keyframes themeFlash{ 50%{ transform:translateY(3px) scale(.96); opacity:.35; } }

  /* —— 底部提示 —— */
  .hint{
    position:fixed; left:50%; bottom:calc(9vh + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    display:flex; align-items:center; gap:12px;
    padding:11px 24px; border-radius:999px;
    color:var(--paper); font-family:var(--serif);
    font-size:15px; letter-spacing:.22em; white-space:nowrap;
    background:rgba(14,20,44,.55);
    border:1px solid rgba(240,230,210,.18);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    pointer-events:none;
    animation:bob 3.2s ease-in-out infinite;
    transition:opacity 1.2s ease;
  }
  .hint .snd{ font-size:12px; opacity:.55; letter-spacing:.1em; }
  .hint svg{ flex:none; opacity:.85; animation:spin 2.6s linear infinite; }
  .hint.gone{ opacity:0; }
  @keyframes bob{ 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-7px)} }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  /* —— 右下控制 —— */
  .panel{
    position:fixed; right:calc(18px + env(safe-area-inset-right));
    bottom:calc(18px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:flex-end; gap:12px;
    font-family:var(--serif); color:var(--paper);
  }
  .meter{ text-align:right; line-height:1.15; }
  .meter b{
    font-size:30px; font-weight:700; font-variant-numeric:tabular-nums;
    color:#ffcf9e; text-shadow:0 0 14px rgba(255,180,110,.35);
  }
  .meter label{ display:block; font-size:11px; letter-spacing:.32em; opacity:.55; }
  .panel button{
    font-family:var(--serif); font-size:14px; letter-spacing:.3em;
    padding:10px 18px 10px 22px; border-radius:999px;
    color:var(--paper); background:rgba(14,20,44,.55);
    border:1px solid rgba(226,96,63,.55);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    cursor:pointer; transition:all .25s ease;
    touch-action:manipulation;
  }
  .panel button:hover{ border-color:var(--accent); box-shadow:0 0 18px rgba(226,96,63,.25); }
  .panel button.on{
    background:var(--accent); border-color:var(--accent); color:#1b0f0a;
    box-shadow:0 0 26px rgba(226,96,63,.5);
  }

  /* —— 首次开声引导(仅触屏 & 音频未解锁时) —— */
  .unlock{
    position:fixed; left:50%; top:26%; transform:translateX(-50%);
    padding:12px 26px; border-radius:999px;
    font-family:var(--serif); font-size:15px; letter-spacing:.2em;
    color:#1b0f0a; background:var(--accent);
    box-shadow:0 0 30px rgba(226,96,63,.55);
    cursor:pointer; z-index:5; white-space:nowrap;
    animation:pulse 1.8s ease-in-out infinite;
    transition:opacity .5s ease;
  }
  .unlock.gone{ opacity:0; pointer-events:none; }
  @keyframes pulse{
    0%,100%{ transform:translateX(-50%) scale(1); }
    50%{ transform:translateX(-50%) scale(1.06); }
  }

  /* —— GitHub 开源角标 —— */
  .ghlink{
    position:fixed;
    top:calc(24px + env(safe-area-inset-top));
    right:calc(20px + env(safe-area-inset-right));
    font-family:var(--serif); font-size:12px; letter-spacing:.26em;
    color:var(--paper); opacity:.5; text-decoration:none;
    border:1px solid rgba(240,230,210,.35); border-radius:999px;
    padding:6px 12px 6px 15px;
    transition:all .25s ease;
  }
  .ghlink:hover{ opacity:1; border-color:var(--accent); color:#ffcf9e; box-shadow:0 0 16px rgba(226,96,63,.25); }

  /* —— 本站实时统计 —— */
  .stats{
    position:fixed;
    left:50%; bottom:calc(8px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    font-family:var(--serif); font-size:11px; letter-spacing:.14em;
    color:var(--paper); opacity:.62; white-space:nowrap;
    pointer-events:none; z-index:2;
  }
  .stats b{
    color:#ffcf9e; font-weight:700; font-variant-numeric:tabular-nums;
  }
  .stats.is-loading{ opacity:.4; }

  /* —— 左下注脚 —— */
  .lore{
    position:fixed;
    left:calc(22px + env(safe-area-inset-left));
    bottom:calc(22px + env(safe-area-inset-bottom));
    pointer-events:none;
    font-family:var(--serif); font-size:11.5px; letter-spacing:.24em;
    color:var(--paper); opacity:.42; line-height:2;
  }
  .theme-note{
    position:fixed; left:50%; top:calc(65% + env(safe-area-inset-top));
    transform:translate(-50%,-50%); max-width:min(66vw, 460px);
    text-align:center; pointer-events:none;
    color:var(--paper); font-family:var(--serif); font-size:12px;
    letter-spacing:.16em; line-height:1.8; opacity:0;
    transition:opacity .4s ease; text-wrap:balance;
  }
  .theme-note.show{ opacity:.58; }

  @media (max-width:640px){
    .lore{ display:none; }
    .masthead h1{ font-size:clamp(40px, 6.5vh, 58px); }
    .ghlink{ font-size:10.5px; padding:5px 10px 5px 13px; }
    .theme-picker{
      top:calc(100px + env(safe-area-inset-top)); left:12px; right:10px;
      transform:none; max-width:none; gap:8px; align-items:flex-end;
    }
    .theme-kicker{ font-size:9px; writing-mode:horizontal-tb; }
    .theme-row{ flex-wrap:nowrap; }
    .theme-tab{ padding:7px 10px 7px 8px; font-size:11px; letter-spacing:.1em; }
    .hint{
      font-size:13px; letter-spacing:.14em; padding:10px 18px;
      bottom:calc(132px + env(safe-area-inset-bottom));   /* 避开右下控制区 */
    }
    .hint .snd{ display:none; }
    .stats{
      left:calc(12px + env(safe-area-inset-left));
      transform:none; bottom:calc(14px + env(safe-area-inset-bottom));
      max-width:58vw; white-space:normal; line-height:2; text-align:left;
    }
    .theme-note{ top:62%; max-width:76vw; font-size:11px; }
  }
  @media (prefers-reduced-motion:reduce){
    .hint, .hint svg{ animation:none; }
  }
</style>
<style id="visual-refresh">
  :root{
    --ui-ink:#080b0d;
    --ui-paper:#f2f4eb;
    --ui-muted:rgba(242,244,235,.55);
    --ui-line:rgba(242,244,235,.18);
    --ui-mono:"SFMono-Regular","Roboto Mono","Inter",monospace;
    --ui-display:"Arial Narrow","Helvetica Neue",Arial,sans-serif;
  }
  html,body{ background:var(--ui-ink); color:var(--ui-paper); }
  body{ font-family:var(--ui-mono); isolation:isolate; }
  body::before{
    content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:
      radial-gradient(circle at 50% 42%, rgba(154,219,94,.12), transparent 26%),
      linear-gradient(125deg, #080b0d 0%, #10161a 48%, #070a0c 100%);
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.12;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:48px 48px; mask-image:linear-gradient(to bottom, black, transparent 92%);
  }

<script>
'use strict';
/* ============================================================
   竹知了 —— 传统玩具模拟
   物理：甩杆(指针) → 绳系竹筒(质点, 重力+弹性绳+阻力)
   声学：真实竹知了录音采样(转速驱动回放速率)；
         解码失败仍使用同一段 AAC 原声
   ============================================================ */

// roundRect 需 Safari 16+/Chrome 99+，旧内核补一个 arcTo 实现避免整页崩掉
if(!('roundRect' in CanvasRenderingContext2D.prototype)){
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){
    r = Math.min(Math.abs(+r) || 0, w/2, h/2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const FONT = '"Songti SC","Noto Serif SC","Noto Serif CJK SC","STSong","SimSun",serif';

/* ---------- AI 公司主题：从 JSON 配置动态加载 ---------- */
let THEMES = [];
let activeTheme = null;
let logoCache = {};

// 加载所有主题配置
async function loadThemes() {
  const themeIds = ['bamboo', 'openai', 'anthropic', 'google', 'meta', 'xai', 'apple', 'nvidia', 'tesla', 'dji', 'btc', 'eth', 'usdt', 'bnb', 'sol'];
  const promises = themeIds.map(id =>
    fetch(`configs/${id}.json`)
      .then(r => r.json())
      .then(config => {
        // 预加载 SVG logo
        const img = new Image();
        img.src = `logos/${id}.svg`;
        logoCache[id] = img;
        return config;
      })
  );
  THEMES = await Promise.all(promises);
  activeTheme = THEMES[0];
  initThemeUI();
}
let themeNoticeTimer = 0;

const themeNameEl = document.getElementById('themeName');
const themeSubEl = document.getElementById('themeSub');
const themeSealEl = document.getElementById('themeSeal');
const themeLoreEl = document.getElementById('themeLore');
const themeTabsEl = document.getElementById('themeTabs');
const themeNoteEl = document.getElementById('themeNote');
const hintCopyEl = document.getElementById('hintCopy');
const hintSoundEl = document.getElementById('hintSound');

function renderThemeTabs(){
  if(THEMES.length === 0) return;
  themeTabsEl.textContent = '';

  // 分组：AI 公司（第一排）、科技公司（第二排）、加密货币（第三排）
  const aiCompanies = THEMES.filter(t => t.category === 'AI 大模型' || t.category === 'AI 安全' || t.category === '开源 AI' || t.id === 'bamboo');
  const techCompanies = THEMES.filter(t => t.category === '消费电子' || t.category === 'AI 硬件' || t.category === '电动汽车' || t.category === '无人机');
  const cryptoCompanies = THEMES.filter(t => t.category === '加密货币');

  // 第一排：AI 公司
  const row1 = document.createElement('div');
  row1.className = 'theme-row';
  for(const theme of aiCompanies){
    const button = document.createElement('button');
    button.className = 'theme-tab' + (theme.id === activeTheme.id ? ' active' : '');
    button.type = 'button';
    button.dataset.theme = theme.id;
    const colors = theme.colors || theme;
    button.style.setProperty('--tab-accent', colors.accent);
    const swatch = document.createElement('span');
    swatch.className = 'swatch';
    const label = document.createElement('span');
    label.textContent = theme.name;
    button.append(swatch, label);
    button.addEventListener('click', () => setTheme(theme.id));
    row1.append(button);
  }
  themeTabsEl.append(row1);

  // 第二排：科技公司
  const row2 = document.createElement('div');
  row2.className = 'theme-row';
  for(const theme of techCompanies){
    const button = document.createElement('button');
    button.className = 'theme-tab' + (theme.id === activeTheme.id ? ' active' : '');
    button.type = 'button';
    button.dataset.theme = theme.id;
    const colors = theme.colors || theme;
    button.style.setProperty('--tab-accent', colors.accent);
    const swatch = document.createElement('span');
    swatch.className = 'swatch';
    const label = document.createElement('span');
    label.textContent = theme.name;
    button.append(swatch, label);
    button.addEventListener('click', () => setTheme(theme.id));
    row2.append(button);
  }
  themeTabsEl.append(row2);

  // 第三排：加密货币
  if(cryptoCompanies.length > 0){
    const row3 = document.createElement('div');
    row3.className = 'theme-row';
    for(const theme of cryptoCompanies){
      const button = document.createElement('button');
      button.className = 'theme-tab' + (theme.id === activeTheme.id ? ' active' : '');
      button.type = 'button';
      button.dataset.theme = theme.id;
      const colors = theme.colors || theme;
      button.style.setProperty('--tab-accent', colors.accent);
      const swatch = document.createElement('span');
      swatch.className = 'swatch';
      const label = document.createElement('span');
      label.textContent = theme.name;
      button.append(swatch, label);
      button.addEventListener('click', () => setTheme(theme.id));
      row3.append(button);
    }
    themeTabsEl.append(row3);
  }
}

function applyThemeUI(showNotice){
  if(!activeTheme) return;
  const root = document.documentElement;
  const colors = activeTheme.colors || activeTheme;
  root.style.setProperty('--ink', colors.ink);
  root.style.setProperty('--paper', colors.paper);
  root.style.setProperty('--accent', colors.accent);
  root.style.setProperty('--accent-dim', colors.accentDim);
  themeNameEl.textContent = activeTheme.name;
  themeSubEl.textContent = activeTheme.subtitle || activeTheme.sub;
  themeSealEl.textContent = activeTheme.seal;
  themeLoreEl.innerHTML = activeTheme.lore.join('<br>');
  hintCopyEl.textContent = activeTheme.hint || '按住 · 画圈 · 甩起来';
  hintSoundEl.textContent = activeTheme.sound || '🔊 竹知了';
  // 显示描述和语录
  let noteContent = activeTheme.description || activeTheme.note || '';
  if(activeTheme.quotes && activeTheme.quotes.length > 0){
    noteContent += '<br><br><em style="opacity:0.7;font-size:0.9em;">经典语录：</em>';
    const displayQuotes = activeTheme.quotes.slice(0, 3); // 显示前3条
    noteContent += '<br>' + displayQuotes.map(q => '• ' + q).join('<br>');
  }
  themeNoteEl.innerHTML = noteContent;
  // 随机选择一条语录作为背景
  if(activeTheme.quotes && activeTheme.quotes.length > 0){
    const randomQuote = activeTheme.quotes[Math.floor(Math.random() * activeTheme.quotes.length)];
    activeTheme.quote = randomQuote;
  }
  renderThemeTabs();
  if(showNotice){
    themeNoteEl.classList.add('show');
    clearTimeout(themeNoticeTimer);
    themeNoticeTimer = setTimeout(() => themeNoteEl.classList.remove('show'), 3400);
  }
}

function initThemeUI(){
  // 读取 URL hash 设置初始主题
  const hash = window.location.hash.slice(1);
  const hashTheme = THEMES.find(t => t.id === hash);
  activeTheme = hashTheme || THEMES[0];
  applyThemeUI(false);
  resize();
  // 监听 hash 变化
  window.addEventListener('hashchange', () => {
    const newHash = window.location.hash.slice(1);
    if(newHash && newHash !== activeTheme.id){
      setTheme(newHash, false);
    }
  });
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

/* ---------- 玩具参数 ---------- */
let ROPE_LEN = 150;       // 绳长 px（随屏幕尺寸调整）
let AUTO_R   = 58;        // 自动甩画圈半径（随屏幕尺寸调整）
const ROPE_K   = 2600;    // 绳弹性 (加速度/px)
const ROPE_D   = 14;      // 绳径向阻尼
const GRAV     = 1150;    // 重力 px/s^2
const AIR_DRAG = 0.35;    // 空气阻力系数

/* ---------- 状态 ---------- */
const stick  = { x: 0, y: 0 };            // 甩杆杆梢
const target = { x: 0, y: 0 };            // 指针目标
const tube   = { x: 0, y: 0, vx: 0, vy: 0 }; // 竹筒(质点)
const pointer = { down: false, id: null, lift: 0 };  // lift: 触摸时锚点上移量
const auto = { on: false, rps: 0, phase: 0, cx: 0, cy: 0, tubeRps: 0, tubePhase: 0 };
let interacted = false;                   // 玩家是否已上手

function recenterToy(){
  target.x = stick.x = W*0.5;
  target.y = stick.y = H*0.42;
  tube.x = stick.x + 8;
  tube.y = stick.y + ROPE_LEN*0.92;
  tube.vx = 34; tube.vy = 0;
  prevTheta = Math.atan2(tube.y - stick.y, tube.x - stick.x);
}

let theta = 0, prevTheta = 0, omega = 0;  // 绳方向角与角速度
let ropeDist = ROPE_LEN, taut = 0;
let rps = 0, drive = 0, active = 0;       // 声音驱动量 0~1
let audioLevel = 0, audioPulse = 0;       // 实际输出包络，视觉反馈跟着声音走
let singTime = 0, hintGone = false;
let idleTime = 0;                         // 完全静置的累计时长
let revAccum = 0;                         // 手动甩的角度累计(每 2π 记一哇)
let needSoundTime = 0;                    // "想出声却出不了"的持续时长

/* ---------- 场景缓存(随 resize 重建为离屏层，避免每帧全屏静态重绘) ---------- */
let bgLayer = null, moonBambooLayer = null, fgLayer = null;
let stars = [], flies = [];
let grainTile = null;
let stickGrad = null, tubeGrad = null;    // 玩具渐变(局部坐标恒定，只建一次)

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  // 某些 webview 布局前会短暂报 0，兜底成 1 避免 0 尺寸画布抛异常
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // 移动端优先：小屏上绳更短、圈更小，拇指画小圈就能甩起来，
  // 且自动甩轨道(绳长+拉伸+圈半径)不出屏
  const minDim = Math.min(W, H);
  ROPE_LEN = clamp(minDim*0.28, 90, 150);
  AUTO_R   = clamp(minDim*0.11, 40, 58);

  // 玩家还没上手时，窗口变化就把玩具重新挂回屏幕中央
  if(!interacted) recenterToy();
  else { target.x = clamp(target.x, 0, W); target.y = clamp(target.y, 0, H); }

  // 旋屏/缩放后自动甩圆心重新钳制，避免玩具整体转出屏幕
  if(auto.on){
    const orbitMargin = ROPE_LEN*1.02 + AUTO_R + 36;
    const marginX = Math.min(W*.49, orbitMargin);
    const marginY = Math.min(H*.46, orbitMargin);
    auto.cx = clamp(auto.cx, marginX, W - marginX);
    auto.cy = clamp(auto.cy, marginY, H - marginY);
  }

  const rnd = mulberry32(2024);
  stars = [];
  for(let i = 0; i < 110; i++){
    stars.push({ x: rnd()*W, y: rnd()*H*0.72, r: 0.5 + rnd()*1.1,
                 a: 0.15 + rnd()*0.55, ph: rnd()*TAU, sp: 0.4 + rnd()*1.2 });
  }
  flies = [];
  for(let i = 0; i < 12; i++){
    flies.push({ x: rnd()*W, y: H*(0.45 + rnd()*0.5),
                 vx: (rnd()-0.5)*22, vy: (rnd()-0.5)*12,
                 ph: rnd()*TAU, sp: 0.8 + rnd()*1.4 });
  }
  buildBgLayer();
  buildMoonBambooLayer();
  buildFgLayer();
}

function newLayer(){
  const c = document.createElement('canvas');
  c.width = W * DPR; c.height = H * DPR;
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  return [c, g];
}

/* 背景层：暗色声场 + 低对比网格 */
function buildBgLayer(){
  if(!activeTheme) return;
  const [c, b] = newLayer();
  const colors = activeTheme.colors || activeTheme;
  const bg = colors.bg || ['#0a1028','#16204a','#43325a'];
  b.fillStyle = '#070a0c'; b.fillRect(0, 0, W, H);
  const glow = b.createRadialGradient(W*0.5, H*0.44, 0, W*0.5, H*0.44, Math.max(W,H)*0.62);
  glow.addColorStop(0, (colors.glow || colors.accent) + '22');
  glow.addColorStop(0.42, (colors.glow || colors.accent) + '0b');
  glow.addColorStop(1, (colors.glow || colors.accent) + '00');
  b.fillStyle = glow; b.fillRect(0, 0, W, H);
  b.strokeStyle = 'rgba(240,245,235,.045)'; b.lineWidth = 1;
  for(let y = H*0.18; y < H; y += 56){ b.beginPath(); b.moveTo(0,y); b.lineTo(W,y); b.stroke(); }
  for(let x = -H; x < W + H; x += 86){ b.beginPath(); b.moveTo(x,0); b.lineTo(x + H*.55,H); b.stroke(); }
  b.fillStyle = (colors.glow || colors.accent) + '12';
  for(let i = 0; i < 28; i++){
    const x = (i*73 + W*.17) % W, y = H*(.12 + ((i*37)%77)/100);
    const r = 1 + (i%3);
    b.beginPath(); b.arc(x,y,r,0,TAU); b.fill();
  }

  // 绘制企业文化名言
  if(activeTheme.quote){
    b.save();
    b.globalAlpha = 0.28;
    b.fillStyle = colors.accent;
    b.font = 'italic bold 32px "Georgia", serif';
    b.textAlign = 'center';
    b.textBaseline = 'middle';

    // 在背景中央绘制名言
    const quoteY = H * 0.5;
    const maxWidth = W * 0.85;
    const words = activeTheme.quote.split(' ');
    let line = '';
    let lineY = quoteY - 30;

    for(let i = 0; i < words.length; i++){
      const testLine = line + words[i] + ' ';
      const metrics = b.measureText(testLine);
      if(metrics.width > maxWidth && i > 0){
        b.fillText(line.trim(), W/2, lineY);
        line = words[i] + ' ';
        lineY += 42;
      } else {
        line = testLine;
      }
    }
    b.fillText(line.trim(), W/2, lineY);

    // 添加公司名
    b.font = 'bold 18px Arial';
    b.globalAlpha = 0.35;
    b.fillText('— ' + activeTheme.name + ' —', W/2, lineY + 50);

    b.restore();
  }

  bgLayer = c;
}

function buildThemeMotif(b){
  const rnd = mulberry32(44);
  if(activeTheme.motif === 'sea'){
    const horizon = H*0.63;
    const water = b.createLinearGradient(0, horizon, 0, H);
    water.addColorStop(0, 'rgba(99,213,214,.16)');
    water.addColorStop(1, 'rgba(2,24,42,.62)');
    b.fillStyle = water; b.fillRect(0, horizon, W, H-horizon);
    b.strokeStyle = 'rgba(133,232,228,.16)'; b.lineWidth = 1;
    for(let row = 0; row < 7; row++){
      const y = horizon + 20 + row*34;
      b.beginPath();
      for(let x = -30; x <= W+30; x += 24){
        const yy = y + Math.sin(x*.018 + row)*4;
        if(x === -30) b.moveTo(x, yy); else b.lineTo(x, yy);
      }
      b.stroke();
    }
    b.fillStyle = 'rgba(207,250,247,.1)';
    b.beginPath(); b.arc(W*.78, H*.18, 26, 0, TAU); b.fill();
    return;
  }
  if(activeTheme.motif === 'garage'){
    b.fillStyle = 'rgba(239,181,79,.055)';
    b.fillRect(0, H*.6, W, H*.4);
    for(let i = 0; i < 4; i++){
      const x = W*(0.08 + i*.31), y = H*(0.28 + (i%2)*.16), r = 70 + i*18;
      b.strokeStyle = 'rgba(234,176,79,.12)'; b.lineWidth = 8;
      b.beginPath(); b.arc(x, y, r, 0, TAU); b.stroke();
      b.strokeStyle = 'rgba(234,176,79,.07)'; b.lineWidth = 2;
      for(let tooth = 0; tooth < 12; tooth++){
        const a = tooth*TAU/12;
        b.beginPath(); b.moveTo(x+Math.cos(a)*(r-5), y+Math.sin(a)*(r-5));
        b.lineTo(x+Math.cos(a)*(r+14), y+Math.sin(a)*(r+14)); b.stroke();
      }
    }
    return;
  }
  if(activeTheme.motif === 'ice'){
    b.fillStyle = 'rgba(185,235,255,.09)';
    for(let i = 0; i < 13; i++){
      const x = rnd()*W, y = H*(0.15 + rnd()*0.75), r = 12 + rnd()*30;
      b.beginPath();
      b.moveTo(x, y-r); b.lineTo(x+r*.72, y-r*.15); b.lineTo(x+r*.35, y+r);
      b.lineTo(x-r*.6, y+r*.6); b.lineTo(x-r, y-r*.2); b.closePath(); b.fill();
    }
    b.strokeStyle = 'rgba(221,250,255,.12)'; b.lineWidth = 1;
    for(let i = 0; i < 22; i++){
      const x = rnd()*W, y = rnd()*H*.78;
      b.beginPath(); b.moveTo(x-3, y); b.lineTo(x+3, y); b.moveTo(x, y-3); b.lineTo(x, y+3); b.stroke();
    }
    return;
  }
  if(activeTheme.motif === 'reel'){
    b.fillStyle = 'rgba(215,239,132,.05)';
    b.fillRect(0, H*.58, W, H*.42);
    for(let i = 0; i < 5; i++){
      const x = W*(.12 + i*.22), y = H*(.18 + (i%2)*.2), r = 34 + i*11;
      b.strokeStyle = 'rgba(216,238,130,.14)'; b.lineWidth = 2;
      b.beginPath(); b.arc(x, y, r, 0, TAU); b.stroke();
      b.beginPath(); b.arc(x, y, r*.44, 0, TAU); b.stroke();
      for(let tooth = 0; tooth < 10; tooth++){
        const a = tooth*TAU/10;
        b.beginPath(); b.moveTo(x+Math.cos(a)*(r+4), y+Math.sin(a)*(r+4));
        b.lineTo(x+Math.cos(a)*(r+11), y+Math.sin(a)*(r+11)); b.stroke();
      }
    }
    return;
  }
  if(activeTheme.motif === 'phone'){
    b.fillStyle = 'rgba(159,200,255,.07)';
    for(let i = 0; i < 6; i++){
      const x = W*(.1 + i*.19), y = H*(.15 + (i%3)*.2);
      b.strokeStyle = 'rgba(166,206,255,.14)'; b.lineWidth = 2;
      b.beginPath(); b.roundRect(x, y, 46, 78, 8); b.stroke();
      b.beginPath(); b.arc(x+23, y+86, 28, Math.PI*1.1, Math.PI*1.9); b.stroke();
    }
    return;
  }
  if(activeTheme.motif === 'mouse'){
    b.fillStyle = 'rgba(157,232,183,.05)'; b.fillRect(0, H*.64, W, H*.36);
    b.strokeStyle = 'rgba(157,232,183,.16)'; b.lineWidth = 1;
    for(let i = 0; i < 10; i++){
      const x = W*(.12 + rnd()*.76), y = H*(.2 + rnd()*.62);
      b.beginPath(); b.arc(x, y, 12 + rnd()*22, 0, TAU); b.stroke();
      b.beginPath(); b.moveTo(x-5, y); b.lineTo(x+5, y); b.moveTo(x, y-5); b.lineTo(x, y+5); b.stroke();
    }
    return;
  }
  if(activeTheme.motif === 'tape'){
    b.fillStyle = 'rgba(255,211,122,.06)';
    b.fillRect(0, H*.61, W, H*.39);
    b.save(); b.translate(W*.1, H*.22); b.rotate(-.12);
    b.fillStyle = 'rgba(255,210,117,.13)'; b.fillRect(0, 0, W*.8, 24);
    b.strokeStyle = 'rgba(255,225,160,.27)'; b.lineWidth = 1;
    for(let x = 8; x < W*.8; x += 18){
      const h = (x/18)%5 === 0 ? 16 : 9;
      b.beginPath(); b.moveTo(x, 0); b.lineTo(x, h); b.stroke();
    }
    b.restore();
  }
}

/* 声场轨道层：以主题物件的几何/材质做视觉锚点 */
function buildMoonBambooLayer(){
  if(!activeTheme) return;
  const [c, b] = newLayer();

  // 新版场景不再使用月亮/竹林剪影，改为围绕玩具的声场轨道。
  buildThemeMotif(b);
  if(activeTheme.motif === 'bamboo'){
    const cx = W*.5, cy = H*.42;
    b.strokeStyle = 'rgba(240,245,235,.10)'; b.lineWidth = 1;
    for(let i = 1; i <= 4; i++){
      b.beginPath(); b.arc(cx, cy, Math.min(W,H)*(.12 + i*.065), 0, TAU); b.stroke();
    }
    b.strokeStyle = activeTheme.colors.glow + '24';
    b.beginPath(); b.moveTo(cx - Math.min(W,H)*.34, cy); b.lineTo(cx + Math.min(W,H)*.34, cy); b.stroke();
  }
  moonBambooLayer = c;
  return;

  if(activeTheme.motif !== 'bamboo'){
    buildThemeMotif(b);
    moonBambooLayer = c;
    return;
  }

  const mx = W*0.78, my = H*0.18;
  const mg = b.createRadialGradient(mx, my, 4, mx, my, 150);
  mg.addColorStop(0, 'rgba(247,232,200,0.32)');
  mg.addColorStop(0.25, 'rgba(247,232,200,0.10)');
  mg.addColorStop(1, 'rgba(247,232,200,0)');
  b.fillStyle = mg; b.beginPath(); b.arc(mx, my, 150, 0, TAU); b.fill();
  b.fillStyle = '#f5e9cb';
  b.beginPath(); b.arc(mx, my, 30, 0, TAU); b.fill();
  b.fillStyle = 'rgba(200,180,150,0.35)';
  b.beginPath(); b.arc(mx - 9, my + 5, 6, 0, TAU); b.fill();
  b.beginPath(); b.arc(mx + 8, my - 8, 4, 0, TAU); b.fill();

  const rnd = mulberry32(7);

  function stalk(x0, lean, w){
    let y = H + 20, x = x0;
    b.fillStyle = 'rgba(8,11,26,0.92)';
    while(y > -40){
      const seg = 80 + rnd()*70;
      b.save();
      b.translate(x, y);
      b.rotate(lean);
      b.beginPath();
      b.roundRect(-w/2, -seg, w, seg - 4, w/2);
      b.fill();
      b.restore();
      // 节上生枝叶
      if(rnd() < 0.75 && y < H*0.95){
        const nLeaf = 2 + (rnd()*3 | 0);
        for(let i = 0; i < nLeaf; i++){
          const side = rnd() < 0.5 ? -1 : 1;
          const ang = side * (0.5 + rnd()*0.9) + lean;
          const len = 34 + rnd()*30;
          b.save();
          b.translate(x + side*w*0.4, y - seg + rnd()*seg*0.4);
          b.rotate(ang);
          b.beginPath();
          b.moveTo(0, 0);
          b.quadraticCurveTo(len*0.5, -len*0.16, len, 0);
          b.quadraticCurveTo(len*0.5,  len*0.16, 0, 0);
          b.fill();
          b.restore();
        }
      }
      y -= seg;
      x += Math.sin(lean) * seg * 0.4 + (rnd()-0.5)*6;
    }
  }
  stalk(36, -0.05, 13);
  stalk(86, 0.07, 9);
  if(W > 700){ stalk(W - 52, 0.05, 11); stalk(W - 108, -0.08, 7); }
  moonBambooLayer = c;
}

/* 前景层：暗角 + 胶片颗粒 */
function buildFgLayer(){
  if(!activeTheme) return;
  if(!grainTile){
    grainTile = document.createElement('canvas');
    grainTile.width = grainTile.height = 128;
    const g = grainTile.getContext('2d');
    const img = g.createImageData(128, 128);
    const rnd = mulberry32(99);
    for(let i = 0; i < img.data.length; i += 4){
      const v = rnd()*255 | 0;
      img.data[i] = img.data[i+1] = img.data[i+2] = v;
      img.data[i+3] = 7;
    }
    g.putImageData(img, 0, 0);
  }
  const [c, b] = newLayer();
  const vig = b.createRadialGradient(W*0.5, H*0.46, Math.min(W,H)*0.35, W*0.5, H*0.5, Math.max(W,H)*0.75);
  vig.addColorStop(0, 'rgba(5,6,16,0)');
  vig.addColorStop(1, 'rgba(5,6,16,0.55)');
  b.fillStyle = vig; b.fillRect(0, 0, W, H);
  b.fillStyle = b.createPattern(grainTile, 'repeat');
  b.fillRect(0, 0, W, H);
  fgLayer = c;
}

    owner.loading = true;
    fetch(theme.audio, { cache:'force-cache' })
      .then(res => { if(!res.ok) throw new Error('sample '+res.status); return res.arrayBuffer(); })
      .then(bytes => AC.decodeAudioData(bytes))
      .then(buf => {
        if(au !== owner || activeTheme.id !== theme.id) return;
        owner.loading = false;
        startThemeSampleVoice(buf, theme, fromGesture);
      })
      .catch(() => {
        if(au !== owner || activeTheme.id !== theme.id) return;
        owner.loading = false;
        startNativeThemeVoice(theme, fromGesture);
      });
    return;
  }
  const owner = au;
  owner.loading = true;
  try{
    if(!sampleBytes){
      const bin = atob(ZZL_SAMPLE);
      sampleBytes = new Uint8Array(bin.length);
      for(let i = 0; i < bin.length; i++) sampleBytes[i] = bin.charCodeAt(i);
    }
    AC.decodeAudioData(sampleBytes.slice().buffer,
      buf => {
        if(au !== owner || activeTheme.id !== 'bamboo') return;
        owner.loading = false;
        startSampleVoice(buf, fromGesture);
      },
      () => {
        if(au !== owner || activeTheme.id !== 'bamboo') return;
        owner.loading = false;
        startNativeVoice(fromGesture);
      });
  }catch(_){
    owner.loading = false;
    startNativeVoice(fromGesture);
  }
}

function ensureAudio(fromGesture){
  if(AC && (AC.state === 'closed' || audioStalled())){
    const now = performance.now();
    acRebuilds = acRebuilds.filter(ts => now - ts < 60000);
    if(!fromGesture && acRebuilds.length >= 3) return;   // 无手势自动重建 60s 限 3 次
    acRebuilds.push(now);
    stopVoice();
    try{ AC.close(); }catch(_){}
    AC = null; au = null;
    acTimeLast = 0; acAdvanceWall = 0;
  }
  if(AC){
    // 'suspended' 与 iOS 非标准的 'interrupted' 一并恢复
    if(AC.state !== 'running') AC.resume().catch(() => {});
    if(!au?.mode) startThemeVoice(fromGesture);
    if(fromGesture && au?.mode === 'native') primeNativeVoice();
    return;
  }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return;
  AC = new Ctx();
  AC.resume().catch(() => {});
  acTimeLast = 0; acAdvanceWall = performance.now();

  // 公共输出链：总闸 → 压限 → 分析器 → 扬声器
  const master = AC.createGain(); master.gain.value = 0;
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 8;
  comp.attack.value = 0.004; comp.release.value = 0.18;
  const analyser = AC.createAnalyser(); analyser.fftSize = 1024;
  master.connect(comp); comp.connect(analyser); analyser.connect(AC.destination);
  au = { master, analyser, meterData: new Float32Array(analyser.fftSize), mode: null, loading: false };

  startThemeVoice(fromGesture);
}

/* 把样本尾部 28ms 等功率交叉淡化烘进头部，避免长交叉淡化把第一拍抹软 */
function installLoopBuffer(buf){
  if(!AC || !au || au.mode) return false;
  const sr = buf.sampleRate;
  const F = Math.min(Math.floor(sr*0.028), Math.floor(buf.length/4));
  const loopLen = buf.length - F;
  if(loopLen <= sr*0.2) return false;
  const loop = AC.createBuffer(1, loopLen, sr);
  const s = buf.getChannelData(0), d = loop.getChannelData(0);
  d.set(s.subarray(0, loopLen));
  for(let i = 0; i < F; i++){
    const p = Math.PI/2 * i/F;
    d[i] = s[i]*Math.sin(p) + s[loopLen + i]*Math.cos(p);
  }
  au.sampleBuffer = loop;
  au.mode = 'sample';
  return true;
}

/* 竹知了内嵌样本 */
function startSampleVoice(buf, fromGesture){
  if(activeTheme.id !== 'bamboo' || activeTheme.audio){ startThemeVoice(); return; }
  if(!installLoopBuffer(buf)) startNativeVoice(fromGesture);
}

/* meme 主题样本：解码完成后，等视觉甩动的同一帧再起播 */
function startThemeSampleVoice(buf, theme, fromGesture){
  if(!theme?.audio || !au || au.mode || activeTheme.id !== theme.id) return;
  if(!installLoopBuffer(buf)) startNativeThemeVoice(theme, fromGesture);
}

/* 原生 AAC 兜底：竹知了主题仍使用同一段真实录音 */
function startNativeVoice(fromGesture){
  if(!au || au.mode) return;
  const el = new Audio();
  el.preload = 'auto';
  el.loop = true;
  el.playsInline = true;
  el.volume = 0;
  el.src = 'data:audio/mp4;base64,' + ZZL_SAMPLE;
  au.native = el;
  au.mode = 'native';
  au.loading = false;
  au.nativePlaying = false;
  au.nativePrimePending = false;
  if(fromGesture) primeNativeVoice();
}

/* 真实 meme 样本：先预热权限，等视觉真正甩起来再从片头同步播放。 */
function startNativeThemeVoice(theme, fromGesture){
  if(!au || au.mode || !theme?.audio) return;
  const el = new Audio();
  el.preload = 'auto';
  el.loop = true;
  el.playsInline = true;
  el.volume = 0;
  el.src = theme.audio;
  au.native = el;
  au.mode = 'native';
  au.loading = false;
  au.nativePlaying = false;
  au.nativePrimePending = false;
  if(fromGesture) primeNativeVoice();
}

function primeNativeVoice(){
  if(!au?.native || au.nativePlaying || au.nativePrimePending) return;
  const el = au.native;
  au.nativePrimePending = true;
  const p = el.play();
  if(!p || !p.then){ au.nativePrimePending = false; return; }
  p.then(() => {
    if(!au || au.native !== el) return;
    au.nativePrimePending = false;
    if(!au.nativePlaying){
      el.pause();
      try{ el.currentTime = 0; }catch(_){ }
    }
  }).catch(() => {
    if(au?.native === el) au.nativePrimePending = false;
  });
}

function playNativeAtSync(){
  if(!au?.native || au.nativePlaying) return;
  const el = au.native;
  try{ el.currentTime = 0; }catch(_){ }
  au.nativePlaying = true;
  au.nativePrimePending = false;
  const p = el.play();
  if(p && p.catch) p.catch(() => {
    if(au?.native === el) au.nativePlaying = false;
  });
}

function stopNativeAtSync(){
  if(!au?.native || !au.nativePlaying) return;
  au.native.pause();
  try{ au.native.currentTime = 0; }catch(_){ }
  au.nativePlaying = false;
}

function playSampleAtSync(){
  if(!AC || !au?.sampleBuffer || au.sample) return;
  const src = AC.createBufferSource();
  src.buffer = au.sampleBuffer; src.loop = true;
  src.connect(au.master); src.start();
  au.sample = src;
}

function stopSampleAtSync(){
  if(!au?.sample) return;
  try{ au.sample.stop(); }catch(_){ }
  au.sample = null;
}

function updateAudio(dt){
  if(!AC || AC.state !== 'running' || !au || !au.mode){
    audioLevel *= Math.max(0, 1 - dt*10);
    audioPulse *= Math.max(0, 1 - dt*14);
    return;
  }
  const t = AC.currentTime;
  const engaged = active > AUDIO_SYNC_ACTIVE && rps > AUDIO_SYNC_RPS;
  // 总响度
  au.master.gain.setTargetAtTime(0.85*Math.pow(active, 1.3), t, 0.07);

  if(au.mode === 'sample'){
    if(engaged) playSampleAtSync();
    else if(active < 0.05) stopSampleAtSync();
    // 精修素材固定原速播放；变速会同时改变音高，是“声音发脏”的主要来源之一。
    if(au.sample){
      au.sample.playbackRate.setTargetAtTime(1, t, 0.04);
      au.sample.detune.setTargetAtTime(0, t, 0.04);
    }
  }else if(au.mode === 'native'){
    if(engaged) playNativeAtSync();
    else if(active < 0.05) stopNativeAtSync();
    au.native.playbackRate = 1;
    au.native.volume = engaged ? clamp(0.9*Math.pow(active, 1.3), 0, 1) : 0;
  }

  // 视觉声波读取真实输出包络，而不是按固定计时器假装“同步”。
  let rms = 0;
  const data = au.meterData;
  if(engaged && data){
    au.analyser.getFloatTimeDomainData(data);
    for(let i = 0; i < data.length; i++) rms += data[i]*data[i];
    rms = Math.sqrt(rms/data.length);
  }
  const rawLevel = engaged ? clamp((rms - 0.004)/0.16, 0, 1) : 0;
  const previous = audioLevel;
  audioLevel += (rawLevel - audioLevel)*Math.min(1, dt*(rawLevel > audioLevel ? 20 : 8));
  audioPulse = Math.max(audioPulse*Math.max(0, 1 - dt*15), Math.max(0, audioLevel - previous)*5);
}


/* ============================================================
   物理
   ============================================================ */
function physStep(h){
  const dx = tube.x - stick.x, dy = tube.y - stick.y;
  const d = Math.hypot(dx, dy) || 1e-6;
  const ux = dx/d, uy = dy/d;
  let ax = 0, ay = GRAV;
  if(d > ROPE_LEN){                       // 绳只拉不推
    const vrad = tube.vx*ux + tube.vy*uy;
    const f = -ROPE_K*(d - ROPE_LEN) - ROPE_D*vrad;
    ax += f*ux; ay += f*uy;
  }
  ax -= AIR_DRAG*tube.vx;
  ay -= AIR_DRAG*tube.vy;
  tube.vx += ax*h; tube.vy += ay*h;
  tube.x += tube.vx*h; tube.y += tube.vy*h;

  // 绳子近似不可伸长；高速自动甩时限制弹簧过度拉长，避免玩具冲出屏幕。
  const ndx = tube.x - stick.x, ndy = tube.y - stick.y;
  const nd = Math.hypot(ndx, ndy) || 1e-6;
  const maxStretch = ROPE_LEN*1.08;
  if(nd > maxStretch){
    const nx = ndx/nd, ny = ndy/nd;
    tube.x = stick.x + nx*maxStretch;
    tube.y = stick.y + ny*maxStretch;
    const outward = tube.vx*nx + tube.vy*ny;
    if(outward > 0){ tube.vx -= outward*nx; tube.vy -= outward*ny; }
  }
}

function update(dt){
  // 甩杆目标：手动指针 / 自动画圈 / 甩手机体感
  if(auto.on){
    // 自动演示分别控制手柄与玩具圆周，稳定进入与样本接近的快速节奏。
    auto.rps += (3.8 - auto.rps)*Math.min(1, dt*2.8);
    auto.tubeRps += (4.2 - auto.tubeRps)*Math.min(1, dt*3.2);
    auto.phase += auto.rps*TAU*dt;
    target.x = auto.cx + AUTO_R*Math.cos(auto.phase);
    target.y = auto.cy + AUTO_R*Math.sin(auto.phase);
  }else{
    auto.rps *= Math.max(0, 1 - dt*3);
    auto.tubeRps *= Math.max(0, 1 - dt*3);
    if(motion.on && !pointer.down){
      // 开了体感却收不到传感器事件(权限/环境问题)，2.5s 后自动退出并提示
      if(!motion.gotEvent && performance.now() - motion.enabledAt > 2500){
        setMotion(false);
        flashBtn(motionBtn, '不可用');
      }else{
        const cx = W*0.5, cy = H*0.42;
        const R = clamp(Math.min(W, H)*(0.16 + motion.shake*0.08), 54, 132);
        // 手机的抖动能量转成稳定的圆周驱动，避免直接把重力噪声映射成漂移。
        const targetRps = 1.15 + motion.shake*4.4;
        motion.spinRps += (targetRps - motion.spinRps)*Math.min(1, dt*4.5);
        if(motion.shake < 0.04) motion.spinRps *= Math.max(0, 1 - dt*2.6);
        motion.phase += motion.spinRps*TAU*dt;
        target.x = cx + Math.cos(motion.phase)*R;
        target.y = cy + Math.sin(motion.phase)*R;
      }
    }
  }
  const k = 1 - Math.exp(-dt*26);
  stick.x += (target.x - stick.x)*k;
  stick.y += (target.y - stick.y)*k;

  // 定步长积分
  let acc = dt;
  const h = 1/240;
  while(acc > 1e-6){ const s = Math.min(h, acc); physStep(s); acc -= s; }

  // 自动模式使用可复现的圆周轨道；停下后保留末速度，回到正常物理惯性。
  if(auto.on){
    auto.tubePhase += auto.tubeRps*TAU*dt;
    const orbitR = ROPE_LEN*1.02;
    const c = Math.cos(auto.tubePhase), s = Math.sin(auto.tubePhase);
    const tangent = auto.tubeRps*TAU*orbitR;
    tube.x = stick.x + c*orbitR;
    tube.y = stick.y + s*orbitR;
    tube.vx = -s*tangent;
    tube.vy =  c*tangent;
  }

  // 角速度(发声核心)：绳方向的转动快慢
  theta = Math.atan2(tube.y - stick.y, tube.x - stick.x);
  let dth = theta - prevTheta;
  while(dth >  Math.PI) dth -= TAU;
  while(dth < -Math.PI) dth += TAU;
  omega += (dth/dt - omega)*Math.min(1, dt*9);
  prevTheta = theta;
  rps = Math.abs(omega)/TAU;

  // 手动甩出的圈数计入「哇」——自动甩不算数
  if(!auto.on && active > 0.3){
    revAccum += Math.abs(dth);
    if(revAccum >= TAU){
      const n = Math.floor(revAccum/TAU);
      revAccum -= n*TAU;
      addWah(n);
    }
  }else{
    revAccum = 0;
  }

  ropeDist = Math.hypot(tube.x - stick.x, tube.y - stick.y);
  taut = clamp((ropeDist/ROPE_LEN - 0.88)/0.12, 0, 1);
  drive = clamp((rps - 1.1)/2.6, 0, 1);
  const tgt = Math.pow(drive, 1.25)*taut;
  active += (tgt - active)*Math.min(1, dt*(tgt > active ? 10 : 3.2));

  // 完全静置 8s 后挂起音频线程省电；任何交互的 ensureAudio 都会恢复
  if(active < 0.02 && rps < 0.15 && !pointer.down && !auto.on && !motion.on){
    idleTime += dt;
    if(idleTime > 8 && AC && AC.state === 'running') AC.suspend().catch(() => {});
  }else{
    idleTime = 0;
  }

  updateAudio(dt);

  // 音频心跳采样：currentTime 停走 1.5s 即判僵尸，就地重建
  // (重建发生在无手势的帧循环里时，新上下文可能挂起，由解锁药丸引导恢复)
  if(AC && AC.state === 'running'){
    const ct = AC.currentTime;
    if(ct !== acTimeLast){
      acTimeLast = ct;
      acAdvanceWall = performance.now();
    }else if(audioStalled()){
      ensureAudio();
    }
  }else if(AC){
    // 非 running(静置挂起/来电中断等)期间宽限期持续顺延，
    // 恢复 running 的瞬间才不会把健康上下文误判成僵尸杀掉
    acAdvanceWall = performance.now();
  }

  // "想出声却出不了"：正在甩/自动/体感模式下上下文却没在跑 → 重新亮出解锁引导
  const wantSound = auto.on || motion.on || pointer.down || active > 0.05;
  if(wantSound && AC && AC.state !== 'running') needSoundTime += dt;
  else needSoundTime = 0;

  if(active > 0.3){
    singTime += dt;
    if(!hintGone && singTime > 1.0){
      hintGone = true;
      document.getElementById('hint').classList.add('gone');
    }
  }
  spawnFx(dt);
}

/* ============================================================
   视觉特效粒子
   ============================================================ */
const ripples = [];   // 声波涟漪
const cries = [];     // 飘出的「哇」
const trail = [];     // 竹筒运动轨迹
let rippleTimer = 0, cryTimer = 0;

function spawnFx(dt){
  trail.unshift({ x: tube.x, y: tube.y });
  if(trail.length > 16) trail.pop();

  rippleTimer -= dt; cryTimer -= dt;
  const audioPlaying = !!(au && ((au.mode === 'sample' && au.sample) || (au.mode === 'native' && au.nativePlaying)));
  const fxStrength = audioPlaying ? audioLevel : active;
  if(fxStrength > 0.045 && (audioPulse > 0.045 || rippleTimer <= 0)){
    rippleTimer = 0.13 - 0.055*fxStrength;
    ripples.push({ x: tube.x, y: tube.y, r: 16, age: 0, life: 0.7, str: fxStrength });
    audioPulse *= 0.35;
  }
  if(fxStrength > 0.12 && cryTimer <= 0 && cries.length < 36){
    cryTimer = 0.20;
    const ux = (tube.x - stick.x)/(ropeDist || 1);
    const uy = (tube.y - stick.y)/(ropeDist || 1);
    const sgn = omega >= 0 ? 1 : -1;
    // 切向飞出
    const tx = -uy*sgn, ty = ux*sgn;
    const sp = 90 + Math.random()*60;
    cries.push({
      x: tube.x + ux*14, y: tube.y + uy*14,
      vx: tx*sp + ux*30, vy: ty*sp + uy*30 - 20,
      age: 0, life: 1.1,
      size: 14 + 22*fxStrength,
      rot: (Math.random() - 0.5)*0.8,
      text: activeTheme.echo,
      color: activeTheme.colors.accent
    });
  }
  for(let i = ripples.length - 1; i >= 0; i--){
    const p = ripples[i];
    p.age += dt; p.r += (200 + 160*p.str)*dt;
    if(p.age >= p.life) ripples.splice(i, 1);
  }
  for(let i = cries.length - 1; i >= 0; i--){
    const p = cries[i];
    p.age += dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= (1 - dt*1.2); p.vy = p.vy*(1 - dt*1.2) - 26*dt;
    if(p.age >= p.life) cries.splice(i, 1);
  }
}

/* ============================================================
   绘制
   ============================================================ */
function draw(now, dt){
  // 背景（天空+暖光，离屏层）
  if(bgLayer && bgLayer.width > 0) ctx.drawImage(bgLayer, 0, 0, W, H);

  // 星
  for(const s of stars){
    const tw = s.a*(0.6 + 0.4*Math.sin(now*s.sp + s.ph));
    ctx.globalAlpha = tw;
    ctx.fillStyle = '#e8ecff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 月 + 竹影（离屏层）
  if(moonBambooLayer && moonBambooLayer.width > 0) ctx.drawImage(moonBambooLayer, 0, 0, W, H);

  // 流萤（按真实 dt 漂移，高刷屏不加速）
  for(const f of flies){
    f.x += f.vx*dt; f.y += f.vy*dt;
    if(f.x < -10) f.x = W + 10; if(f.x > W + 10) f.x = -10;
    if(f.y < H*0.3) f.vy = Math.abs(f.vy);
    if(f.y > H + 10) f.y = H*0.5;
    f.vx += Math.sin(now*0.7 + f.ph)*(18*dt);
    f.vy += Math.cos(now*0.9 + f.ph)*(12*dt);
    const glow = Math.max(0, Math.sin(now*f.sp + f.ph));
    if(glow < 0.05) continue;
    ctx.globalAlpha = glow*0.85;
    ctx.fillStyle = '#ffd98a';
    ctx.shadowColor = '#ffc35e'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(f.x, f.y, 1.8, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  // 声波涟漪
  for(const p of ripples){
    const t = p.age/p.life;
    ctx.globalAlpha = (1 - t)*0.35*p.str;
    ctx.strokeStyle = activeTheme.colors.accent; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 运动残影：渐隐光点（高速下连线会成折线，点更好看）
  const spNorm = clamp(rps/4, 0, 1);
  if(spNorm > 0.05 && trail.length > 2){
    ctx.fillStyle = activeTheme.colors.accent;
    for(let i = 1; i < trail.length; i++){
      const f = 1 - i/trail.length;
      ctx.globalAlpha = f*0.3*spNorm;
      ctx.beginPath();
      ctx.arc(trail[i].x, trail[i].y, 1.5 + 3.5*f, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  drawToy(now);

  // 飘出的「哇」
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const p of cries){
    const t = p.age/p.life;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot*t);
    ctx.globalAlpha = (1 - t)*(1 - t)*0.9;
    ctx.font = `${(p.size*(1 + 0.5*t)).toFixed(1)}px ${FONT}`;
    ctx.fillStyle = p.color || activeTheme.colors.accent;
    ctx.fillText(p.text || activeTheme.echo, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 暗角 + 颗粒（离屏层）
  if(fgLayer && fgLayer.width > 0) ctx.drawImage(fgLayer, 0, 0, W, H);
}

function drawToy(now){
  if(!activeTheme) return;
  if(activeTheme.id === 'bamboo' || !activeTheme.logo) return drawBambooToy(now);
  return drawAILogoToy(now);
}

/* AI logo 圆盘绘制 */
function drawAILogoToy(now){
  const dx = tube.x - stick.x, dy = tube.y - stick.y;
  const a = Math.atan2(dy, dx);
  const colors = activeTheme.colors || activeTheme;
  drawTether(colors.accent, 1.8);
  ctx.save(); ctx.translate(tube.x, tube.y); ctx.rotate(a - Math.PI/2);

  const spin = now * (1 + rps*2);
  const size = 28 + active*8;

  // 发光圆盘背景
  ctx.shadowColor = colors.accent; ctx.shadowBlur = 20 + active*30;
  ctx.fillStyle = colors.ink;
  ctx.beginPath(); ctx.arc(0, 0, size, 0, TAU); ctx.fill();

  // 边框
  ctx.strokeStyle = colors.accent; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, size, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // 绘制 SVG logo
  const logoImg = logoCache[activeTheme.id];
  if(logoImg && logoImg.complete){
    ctx.save(); ctx.rotate(spin);
    const logoSize = size * 1.4;
    ctx.drawImage(logoImg, -logoSize/2, -logoSize/2, logoSize, logoSize);
    ctx.restore();
  } else {
    // 回退：如果 logo 未加载，显示文字
    ctx.save(); ctx.rotate(spin);
    ctx.fillStyle = colors.accent;
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(activeTheme.name.charAt(0), 0, 0);
    ctx.restore();
  }

  ctx.restore();
}

function drawTether(color, width){
  const dx = tube.x - stick.x, dy = tube.y - stick.y;
  const d = Math.hypot(dx, dy) || 1e-6;
  ctx.strokeStyle = color; ctx.lineWidth = width || 1.6;
  ctx.beginPath(); ctx.moveTo(stick.x, stick.y);
  if(d < ROPE_LEN*.97){
    const sag = (ROPE_LEN - d)*.55;
    ctx.quadraticCurveTo((stick.x+tube.x)/2, (stick.y+tube.y)/2+sag, tube.x, tube.y);
  }else ctx.lineTo(tube.x, tube.y);
  ctx.stroke();
  const a = 1.15, sdx = Math.cos(a), sdy = Math.sin(a);
  ctx.save(); ctx.translate(stick.x, stick.y); ctx.rotate(a);
  ctx.strokeStyle = color; ctx.globalAlpha = .8; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(6, 6); ctx.lineTo(76, 76); ctx.stroke();
  ctx.globalAlpha = 1; ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(5, 5, 6, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawBambooToy(now){
  const dx = tube.x - stick.x, dy = tube.y - stick.y;
  const d = Math.hypot(dx, dy) || 1e-6;
  const ux = dx/d, uy = dy/d;

  // 红线：松则垂，紧则直
  ctx.strokeStyle = 'rgba(216,74,53,0.92)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(stick.x, stick.y);
  if(d < ROPE_LEN*0.97){
    const sag = (ROPE_LEN - d)*0.55;
    ctx.quadraticCurveTo((stick.x + tube.x)/2, (stick.y + tube.y)/2 + sag, tube.x, tube.y);
  }else{
    ctx.lineTo(tube.x, tube.y);
  }
  ctx.stroke();

  // 甩杆：细竹签，杆梢串两颗红珠（照实物）；局部坐标绘制以复用渐变
  const sa = 1.15;                 // 杆的固定倾角
  const sdx = Math.cos(sa), sdy = Math.sin(sa);
  ctx.save();
  ctx.translate(stick.x, stick.y);
  if(!stickGrad){
    stickGrad = ctx.createLinearGradient(0, 0, sdx*88, sdy*88);
    stickGrad.addColorStop(0, '#e2cd9a'); stickGrad.addColorStop(1, '#a8894f');
  }
  ctx.strokeStyle = stickGrad;
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(sdx*8, sdy*8);
  ctx.lineTo(sdx*88, sdy*88);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,240,200,0.35)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(sdx*12 - sdy*1.4, sdy*12 + sdx*1.4);
  ctx.lineTo(sdx*76 - sdy*1.4, sdy*76 + sdx*1.4);
  ctx.stroke();
  // 红珠
  const bead = (bx, by, r) => {
    ctx.fillStyle = '#c23324';
    ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,200,180,0.55)';
    ctx.beginPath(); ctx.arc(bx - r*0.3, by - r*0.35, r*0.32, 0, TAU); ctx.fill();
  };
  bead(sdx*14, sdy*14, 4.6);
  bead(sdx*4,  sdy*4,  6);
  ctx.restore();

  // 蝉形竹筒：膜端(头)朝绳，筒身沿绳方向甩出
  ctx.save();
  ctx.translate(tube.x, tube.y);
  ctx.rotate(Math.atan2(uy, ux) - Math.PI/2);
  ctx.scale(1.35, 1.35);

  // 筒身：浅竹色
  if(!tubeGrad){
    tubeGrad = ctx.createLinearGradient(-12, 0, 12, 0);
    tubeGrad.addColorStop(0, '#b7a271');
    tubeGrad.addColorStop(0.3, '#eadfb8');
    tubeGrad.addColorStop(0.62, '#dfd0a2');
    tubeGrad.addColorStop(1, '#9b8452');
  }
  ctx.fillStyle = tubeGrad;
  ctx.beginPath();
  ctx.roundRect(-12, 4, 24, 46, 6);
  ctx.fill();

  // 尾端开口
  ctx.fillStyle = '#4c3d24';
  ctx.beginPath(); ctx.ellipse(0, 49, 11, 4.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(234,223,184,0.6)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(0, 49, 11, 4.2, 0, 0.05, Math.PI - 0.05); ctx.stroke();

  // 一对竹蝉翼：转得越快离心张得越开，同时高频振翅
  const spread  = 0.30 + active*0.38;
  const flutter = active*Math.sin(now*46)*0.22;
  const wing = side => {
    ctx.save();
    ctx.translate(side*9, 13);
    ctx.rotate(side*(spread + flutter));
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(side*13, 9, side*14, 30, side*5, 42);
    ctx.bezierCurveTo(side*-1, 33, side*-4, 12, 0, 0);
    ctx.fillStyle = 'rgba(243,235,211,0.88)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,120,70,0.55)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 翼脉
    ctx.strokeStyle = 'rgba(150,120,70,0.45)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(side*2, 4);  ctx.quadraticCurveTo(side*9, 18, side*5, 38);
    ctx.moveTo(side*1, 6);  ctx.quadraticCurveTo(side*3, 20, side*1.5, 34);
    ctx.stroke();
    ctx.restore();
  };
  wing(-1); wing(1);

  // 红箍(蝉头)
  ctx.fillStyle = '#cf3b2a';
  ctx.beginPath();
  ctx.roundRect(-12.5, 2, 25, 10, 4);
  ctx.fill();

  // 膜面(蒙在红箍里的竹膜) + 发声时透光
  ctx.fillStyle = '#f6eed8';
  ctx.beginPath(); ctx.ellipse(0, 3, 10.5, 4.2, 0, 0, TAU); ctx.fill();
  if(active > 0.05){
    ctx.globalAlpha = active*0.85;
    ctx.shadowColor = '#ffcf8e'; ctx.shadowBlur = 18*active;
    ctx.fillStyle = '#ffe9bd';
    ctx.beginPath(); ctx.ellipse(0, 3, 8.5, 3.4, 0, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  // 一对黑眼睛，点在红箍两侧
  const eye = side => {
    ctx.fillStyle = '#17130c';
    ctx.beginPath(); ctx.arc(side*8.5, 7.5, 2.4, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(side*8.5 - 0.7, 6.8, 0.7, 0, TAU); ctx.fill();
  };
  eye(-1); eye(1);

  // 膜心线结
  ctx.fillStyle = '#d84a35';
  ctx.beginPath(); ctx.arc(0, 2, 2, 0, TAU); ctx.fill();

  ctx.restore();
}

/* ============================================================
   主循环 & 交互
   ============================================================ */
let last = performance.now();
let hudTimer = 0;
const rpsEl = document.getElementById('rps');
const autoBtn = document.getElementById('autoBtn');

function track(name, props){ /* analytics hook — no-op */ }

function haptic(pattern = 10){
  try{
    if(typeof navigator.vibrate === 'function') navigator.vibrate(pattern);
  }catch(_){ }
}

function setControlButton(btn, mark, label, pressed){
  btn.replaceChildren();
  const icon = document.createElement('span');
  icon.className = 'button-mark';
  icon.setAttribute('aria-hidden', 'true');
  icon.textContent = mark;
  btn.append(icon, document.createTextNode(` ${label}`));
  btn.setAttribute('aria-pressed', String(Boolean(pressed)));
}

function setTheme(id, updateHash = true){
  const next = THEMES.find(theme => theme.id === id);
  if(!next) return;
  if(next.id === activeTheme.id){ ensureAudio(true); return; }
  activeTheme = next;
  applyThemeUI(true);
  hintGone = false; singTime = 0;
  document.getElementById('hint').classList.remove('gone');
  ripples.length = 0; cries.length = 0; trail.length = 0;
  stickGrad = null; tubeGrad = null;
  if(W && H){ buildBgLayer(); buildMoonBambooLayer(); buildFgLayer(); }
  if(au){ stopVoice(); ensureAudio(true); }
  haptic(8);
  track('theme_select', { theme: activeTheme.id });
  // 更新 URL hash
  if(updateHash){
    window.location.hash = id;
  }
}

function frame(now){
  // 有些嵌入环境不派发 resize 事件，每帧自查尺寸变化
  if(Math.max(1, window.innerWidth) !== W || Math.max(1, window.innerHeight) !== H) resize();
  // rAF 出现大间隙说明页面被冻结过(部分 WebView 不派发 visibilitychange)，宽限期重置
  if(now - last > 1000) acAdvanceWall = performance.now();
  const dt = Math.min(0.05, (now - last)/1000) || 0.016;
  last = now;
  update(dt);
  draw(now/1000, dt);
  hudTimer -= dt;
  if(hudTimer <= 0){
    hudTimer = 0.15;
    rpsEl.textContent = rps.toFixed(1);
    syncUnlock();
  }
  requestAnimationFrame(frame);
}

function setAuto(on){
  auto.on = on;
  autoBtn.classList.toggle('on', on);
  setControlButton(autoBtn, on ? '■' : '↻', on ? '停一停' : '自动甩', on);
  haptic(on ? [12, 32, 12] : 10);
  if(on){
    track('auto_spin', { state: 'on' });
    interacted = true;
    if(motion.on) setMotion(false);
    const orbitMargin = ROPE_LEN*1.02 + AUTO_R + 36;
    const marginX = Math.min(W*.49, orbitMargin);
    const marginY = Math.min(H*.46, orbitMargin);
    auto.cx = clamp(stick.x, marginX, W - marginX);
    auto.cy = clamp(stick.y, marginY, H - marginY);
    auto.phase = Math.atan2(stick.y - auto.cy, stick.x - auto.cx);
    auto.tubePhase = theta;
    auto.tubeRps = clamp(rps, 0, 1.4);
    ensureAudio(true);
  }
}

autoBtn.addEventListener('click', e => {
  e.stopPropagation();
  setAuto(!auto.on);
});

/* —— 分享按钮 —— */
const shareBtn = document.getElementById('shareBtn');
shareBtn.addEventListener('click', e => {
  e.stopPropagation();
  const url = window.location.href;
  const text = `竹知了 AI 版 - ${activeTheme.name}：${activeTheme.description || activeTheme.subtitle || '一转就哇哇叫'}`;

  // 优先使用 Web Share API（移动端）
  if(navigator.share){
    navigator.share({
      title: '竹知了 AI 版',
      text: text,
      url: url
    }).catch(err => {
      // 用户取消分享，不处理
      if(err.name !== 'AbortError'){
        fallbackShare(url, text);
      }
    });
  } else {
    fallbackShare(url, text);
  }
  haptic(10);
  track('share', { theme: activeTheme.id });
});

function fallbackShare(url, text){
  // 显示分享选项
  const shareOptions = [
    { name: '复制链接', action: () => copyToClipboard(url) },
    { name: 'Twitter/X', action: () => window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, '_blank') },
    { name: '微博', action: () => window.open(`http://service.weibo.com/share/share.php?url=${encodeURIComponent(url)}&title=${encodeURIComponent(text)}`, '_blank') },
    { name: 'QQ', action: () => window.open(`https://connect.qq.com/widget/shareqq/index.html?url=${encodeURIComponent(url)}&title=${encodeURIComponent(text)}`, '_blank') },
    { name: '微信', action: () => alert('请复制链接后在微信中分享：\n' + url) }
  ];

  const menu = document.createElement('div');

function copyToClipboard(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(() => {
      alert('链接已复制到剪贴板');
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    alert('链接已复制到剪贴板');
  } catch (err) {
    alert('复制失败，请手动复制链接：\n' + text);
  }
  document.body.removeChild(textarea);
}

/* —— 摇一摇体感模式：抖动能量驱动稳定圆周，不把重力噪声直接当坐标 —— */
const motion = { on: false, bx: 0, by: 0, bz: 0, shake: 0,
                 spinRps: 0, phase: 0, lastEvent: 0,
                 handler: null, gotEvent: false, enabledAt: 0 };
const motionBtn = document.getElementById('motionBtn');
// devicemotion 只在安全上下文(HTTPS/localhost)派发，非安全页面不显示按钮免得点了没反应
if(typeof DeviceMotionEvent !== 'undefined' && window.isSecureContext){
  motionBtn.style.display = '';
}

function flashBtn(btn, text){
  setControlButton(btn, '!', text, false);
  btn.disabled = true;
  setTimeout(() => {
    setControlButton(btn, '↗', '摇一摇', false);
    btn.disabled = false;
  }, 1600);
}

async function setMotion(on){
  if(on && typeof DeviceMotionEvent !== 'undefined'
        && typeof DeviceMotionEvent.requestPermission === 'function'){
    try{
      const r = await DeviceMotionEvent.requestPermission();  // iOS 需授权
      if(r !== 'granted'){ flashBtn(motionBtn, '未授权'); return; }
    }catch(_){ flashBtn(motionBtn, '未授权'); return; }
  }
  motion.on = on;
  track('motion_spin', { state: on ? 'on' : 'off' });
  document.body.classList.toggle('motion-live', on);
  motionBtn.classList.toggle('on', on);
  setControlButton(motionBtn, on ? '■' : '↗', on ? '停止摇动' : '摇一摇', on);
  haptic(on ? [14, 34, 14] : 10);
  if(on){
    interacted = true;
    if(auto.on) setAuto(false);
    ensureAudio(true);
    motion.bx = motion.by = motion.bz = 0;
    motion.shake = motion.spinRps = 0;
    motion.phase = 0;
    motion.lastEvent = 0;
    motion.gotEvent = false;
    motion.enabledAt = performance.now();
    if(!motion.handler){
      motion.handler = e => {
        const g = (e.acceleration && e.acceleration.x != null)
          ? e.acceleration : e.accelerationIncludingGravity;
        if(!g || g.x == null) return;
        motion.gotEvent = true;
        const now = performance.now();
        if(!motion.lastEvent){
          motion.bx = g.x || 0; motion.by = g.y || 0; motion.bz = g.z || 0;
          motion.lastEvent = now;
          return;
        }
        motion.lastEvent = now;
        // 低通基线滤掉静止重力，留下摇动产生的高频分量。
        motion.bx += ((g.x || 0) - motion.bx)*0.06;
        motion.by += ((g.y || 0) - motion.by)*0.06;
        motion.bz += ((g.z || 0) - motion.bz)*0.06;
        const dx = (g.x || 0) - motion.bx;
        const dy = (g.y || 0) - motion.by;
        const dz = (g.z || 0) - motion.bz;
        const magnitude = Math.hypot(dx, dy, dz);
        const raw = clamp((magnitude - 0.35)/3.2, 0, 1);
        motion.shake += (raw - motion.shake)* (raw > motion.shake ? 0.34 : 0.12);
        motionBtn.classList.toggle('pulse', motion.shake > 0.16);
      };
    }
    window.addEventListener('devicemotion', motion.handler);
  }else if(motion.handler){
    window.removeEventListener('devicemotion', motion.handler);
    motionBtn.classList.remove('pulse');
  }
}
motionBtn.addEventListener('click', e => {
  e.stopPropagation();
  setMotion(!motion.on);
});

cv.addEventListener('pointerdown', e => {
  if(pointer.down) return;                 // 已有手指在甩，忽略误触的第二指
  pointer.down = true;
  pointer.id = e.pointerId;
  // 拇指按住时玩具画在指尖正下会被手挡住，触摸输入把锚点抬到指尖上方
  pointer.lift = e.pointerType === 'touch' ? Math.min(110, ROPE_LEN*0.9) : 0;
  interacted = true;
  track('manual_spin');
  cv.classList.add('holding');
  cv.setPointerCapture(e.pointerId);
  if(auto.on) setAuto(false);
  target.x = e.clientX;
  target.y = Math.max(12, e.clientY - pointer.lift);
  ensureAudio(true);
});
cv.addEventListener('pointermove', e => {
  if(!pointer.down || e.pointerId !== pointer.id) return;
  target.x = e.clientX;
  target.y = Math.max(12, e.clientY - pointer.lift);
});
function release(e){
  if(pointer.down && e && e.pointerId !== pointer.id) return;
  pointer.down = false;
  pointer.id = null;
  cv.classList.remove('holding');
  ensureAudio(true);
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

  track('audio_unlock');

});
function syncUnlock(){
  if(AC && AC.state === 'running'){
    if(!unlockEl.hidden && !unlockEl.classList.contains('gone')){
      unlockEl.classList.add('gone');
      setTimeout(() => { if(unlockEl.classList.contains('gone')) unlockEl.hidden = true; }, 600);
    }
  }else if(needSoundTime > 1.2){
    // 后台切回后重建的上下文没手势解锁不了，自动甩/体感模式又不会再点屏幕——把药丸请回来
    unlockEl.classList.remove('gone');
    unlockEl.hidden = false;
  }
}
