services:
  web:
    build:
      context: .
      dockerfile: php.dockerfile
    container_name: cgos-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  redis:
    image: redis:7-alpine
    container_name: cgos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
